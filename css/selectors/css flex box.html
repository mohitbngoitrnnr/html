<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        .parent{
            height: 80vh;
            border: 1px solid black;
display: flex;
 flex-direction: row;
 flex-wrap: nowrap;
 justify-content: space-evenly;
 align-items: center;
 }
 .child{border: 1px solid;
height: 150px;
width: 150px;
background-color: aqua;}
.child-1{
    order: 1;
    flex-grow: 1;
}
.child-2{order:2;
flex-shrink: 3;}



    </style>
</head>
<body>
    <div class="parent">
                <div class="child child-1">Child one</div>
                <div class="child child-2">Child two</div>
                <div class="child child-3">Child three</div>
            </div>
</body>
</html>
